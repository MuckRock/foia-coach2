services:
  - type: web
    name: foia-coach
    env: docker
    plan: starter
    region: oregon
    preDeployCommand: "python manage.py migrate --no-input && python manage.py collectstatic --no-input"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: foia-coach-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o
      - key: QUERY_REWRITE_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: LLM_TEMPERATURE
        value: "0.2"

databases:
  - name: foia-coach-db
    databaseName: foia_coach
    user: foia_coach
    plan: starter
    region: oregon
