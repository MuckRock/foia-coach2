services:
  - type: web
    name: foia-coach
    env: docker
    plan: starter
    region: oregon
    preDeployCommand: "./bin/pre_deploy.sh"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: foia-coach-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o
      - key: QUERY_REWRITE_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: LLM_TEMPERATURE
        value: "0.2"

  - type: web
    name: agent-moss-mcp
    env: docker
    dockerfilePath: ./Dockerfile.mcp
    plan: starter
    region: oregon
    envVars:
      - key: MOSS_API_URL
        value: https://foia-coach.onrender.com
      - key: MCP_SERVER_URL
        value: https://agent-moss-mcp.onrender.com
      - key: MUCKROCK_API_URL
        value: https://www.muckrock.com/api_v2
      - key: SQUARELET_BASE
        value: https://accounts.muckrock.com
      - key: SQUARELET_CLIENT_ID
        sync: false
      - key: SQUARELET_CLIENT_SECRET
        sync: false

databases:
  - name: foia-coach-db
    databaseName: foia_coach
    user: foia_coach
    plan: basic-256mb
    region: oregon
